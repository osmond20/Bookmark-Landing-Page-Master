<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->
  <link rel="preload" 
  href="fonts/rubik-v31-latin-regular.woff2"
  as="font"
  type="font/woff2"
  crossorigin>
  <link rel="preload" 
  href="fonts/rubik-v31-latin-500.woff2"
  as="font"
  type="font/woff2"
  crossorigin>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <title>Frontend Mentor | Bookmark landing page</title>
</head>
<body>
<nav class="nav-component">
  <a href="">
     <img class="logo-bookmark" src="images/logo-bookmark.svg" alt="Logo of website" height="20" width="20">
  </a>
  <img class="icon-hamburger" src="images/icon-hamburger.svg" alt="20" width="20">
  <img class="icon-close" src="images/icon-close.svg" alt="" height="20" width="20">
  <div class="nav-links-container-2" hidden>
    <a href="">FEATURES</a>
    <a href="">PRICING</a>
    <a href="">CONTACT</a>
    <button>LOGIN</button>
  </div>
</nav>
<aside class="menu-component" aria-hidden="false">
  <div class="menu-links">
    <ul>
      <li class="links">
        <a href="">FEATURES</a>
      </li>
      <li class="links">
        <a href="">PRICING</a>
      </li>
      <li class="links">
        <a href="">CONTACT</a>
      </li>
    </ul>
    <button class="login-button-1">LOGIN</button>
  </div>
  <div class="icon-links-1">
    <a href=""><img src="images/icon-facebook.svg" alt="" height="20" width="20"></a>
    <a href=""><img src="images/icon-twitter.svg" alt="" height="20" width="20"></a>
  </div>
</aside>
<main class="main-content">
  <section class="intro-component">
    <div class="image-holder">
      <img class="illustration-hero" src="images/illustration-hero.svg" alt="">
      <div class="background-el"></div>
    </div>
    <div class="intro-component-content">
      <h1 class="intro-title">A Simple Bookmark Manager</h1>
      <p class="intro-paragraph">A clean and simple interface to organize your favourite websites. Open a new 
  browser tab and see your sites load instantly. Try it for free.</p>
       <div class="intro-link-holder">
         <a class="intro-link-1" href="">Get it on Chrome</a>
        <a class="intro-link-2" href="">Get it on Firefox</a>
       </div>
    </div>
  </section>
  <section class="features-component"></section>
  <section class="download-component"></section>
  <section class="faq-component"></section>
  <section class="ending-component"></section>
</main>
<footer class="footer-container"></footer>
</body>
<script defer src="js/index.js"></script>
</html>
